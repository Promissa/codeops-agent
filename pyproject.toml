[project]
name = "codeops-agent"
version = "0.1.0"
description = "Evidence-aware CodeOps Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.4",
    "typer==0.26.7",
]

[project.optional-dependencies]
rich = [
    "rich==14.2.0",
]

[project.scripts]
codeops = "codeops.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/codeops",
]

[build-system]
requires = [
    "hatchling==1.28.0",
]
build-backend = "hatchling.build"
